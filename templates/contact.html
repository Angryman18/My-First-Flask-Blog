{% extends "layout.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif;}
        * {box-sizing: border-box;}
        
        input[type=text], select, textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
          margin-top: 6px;
          margin-bottom: 16px;
          resize: vertical;
        }

        input[type=email], select, textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
          margin-top: 6px;
          margin-bottom: 16px;
          resize: vertical;
        }
        
        input[type=number], select, textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid #ccc;
          border-radius: 4px;
          box-sizing: border-box;
          margin-top: 6px;
          margin-bottom: 16px;
          resize: vertical;
        }

        input[type=submit] {
          background-color: #4CAF50;
          color: white;
          padding: 12px 20px;
          border: none;
          border-radius: 40px;
          cursor: pointer;
        }
        
        input[type=submit]:hover {
          background-color: #008000;
        }
        
        .containers {
          border-radius: 5px;
          padding: 20px;
          margin-left: 250px;
          margin-right: 250px;
        }
        </style>
        </head>
        <body>
        
        <div class="containers"><center><h3><b>Contact Form</b></h3></center></div>
        
        <div class="containers">
          <form action="/contact" name='MesageSent' method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name..">
        
            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email" placeholder="Your Email ID..">

            <label for="ph_no">Phone No:</label>
            <input type="number" id="ph_no" name="ph_no" placeholder="Your Phone No..">
        
            <label for="subject">Message:</label>
            <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>
        
            <input type="submit" name='submit' value="Submit">
          </form>
        </div>
</body>
</html>
{% endblock %}
