<!DOCTYPE html>
<html>
<head>
  {% if title %}
  <title>
  {{ title }}
  </title>  
  {% endif %}
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">

	<!-- CSS Goes here -->
	

</head>
<body>
	<div class="container p-3">
		<nav class="navbar navbar-expand-lg navbar-light" style="background-color: #e3f2fd;">
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link{% if title=='Admin Home' %} active{% endif %}" href="/admin_panel/home"><strong>Home</strong></a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if title=='Dashboard' %} active{% endif %}" href="/admin_panel/dashboard"><strong>Dashboard</strong></a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if title=='Header' %} active{% endif %}" href="/admin_panel/header"><strong>Header</strong></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin_panel/footer"><strong>Footer</strong></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/admin_panel/pages"><strong>Pages</strong></a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              <strong>Profile</strong>
            </a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdown">
              <a class="dropdown-item" href="#">Edit Profile</a>
              <a class="dropdown-item" href="#">Change Password</a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" href="/logout">Log Out</a>
            </div>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if title=='Profile' %} active{% endif %}" href="/admin_panel/profile"><strong>Profile</strong></a>
          </li>
        </ul>
      </div>
    </nav>
  </div>
{% block content %}
{% endblock content %}

<footer class="footer mt-auto py-3">
  <div class="container">
    <span class="text-muted">{{params['site']}}</span>
  </div>
</footer>

</body>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
